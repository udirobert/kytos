# Kytos Observatory — Netlify static deploy
# Connect this repo at https://app.netlify.com → Add new site → Import from Git.
# Netlify rebuilds on every push to the connected branch (enable in Site settings).

[build]
  # jinja2 must be installed: the observatory templates moved to Jinja2
  # (d15e6fa) and bare python3 has no site-packages on Netlify. Keep this
  # in sync with the top-level imports of frontend/observatory/*.py or the
  # deploy silently sticks on the last good build.
  command = "pip install -q jinja2 && python3 frontend/build.py --experiments experiments --out frontend/dist"
  publish = "frontend/dist"

[build.environment]
  PYTHON_VERSION = "3.12"
  KYTOS_SITE_URL = "https://kytosapp.netlify.app"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

# Pretty URLs: /runs/k001-mean-shift-baseline/ → index.html
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdn.plot.ly; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

# Run visuals (briefing.mp4, hero.png, share-card.png) — static content that
# never changes between deploys. Long-cache like /static/*.
[[headers]]
  for = "/runs/*/visual/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"
