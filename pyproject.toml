[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kytos"
version = "0.0.1"
description = "Predict how an unseen cellular context responds to perturbation (2026 Virtual Cell Challenge)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "polars",
    "anndata",
    "scanpy",
    "scvi-tools",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
]
eval = [
    "cell-eval",
    "pdex",
]
obs = [
    "openai>=1.0",
    "tavily-python>=0.3",
    "fal-client>=0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
