[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kytos"
version = "0.0.1"
description = "Predict how an unseen cellular context responds to perturbation (2026 Virtual Cell Challenge)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "polars",
    "anndata",
    "scanpy",
    "scvi-tools",
    "jinja2>=3.1",
    # torch (via scvi-tools): newest releases ship no macOS arm64 wheel —
    # fork the constraint so linux/teammates stay on latest, macOS resolves
    # to the newest version with a wheel.
    "torch; sys_platform != 'darwin'",
    "torch<2.13; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
]
eval = [
    "cell-eval",
    "pdex",
]
obs = [
    "openai>=1.0",
    "tavily-python>=0.3",
    "fal-client>=0.2",
    "playwright>=1.40",
    "certifi",
    "hai-agents>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
