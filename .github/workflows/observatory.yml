name: observatory-publish

# The autonomy loop: a push touching experiments/ runs the enrichment (audit →
# facts), the partner enrichment (narrative → grounding check → literature → NER →
# visuals → briefing), verification, and a build smoke test — then commits the
# artifacts back so Netlify deploys them. Frontend-only pushes are intentionally
# excluded: they cannot change experiment artifacts, so filtering them out stops
# a follow-up bot commit after every routine UI push. See the churn guard in the
# "Commit enrichment artifacts" step — timestamp-only diffs are never pushed.
#
# Secrets (all optional — every tool degrades to exit 0 without them):
#   OPENAI_API_KEY, TAVILY_API_KEY, FAL_KEY, HAI_API_KEY
on:
  push:
    branches: [main]
    paths:
      - "experiments/**"
      - "tools/**"
      - "src/**"
      - ".github/workflows/observatory.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly cadence, Mondays 06:00 UTC

concurrency:
  group: observatory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enrich-and-publish:
    # Never retrigger on our own bot commits.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight enrichment environment
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet pytest numpy jinja2 pillow openai tavily-python fal-client playwright certifi
          .venv/bin/playwright install --with-deps chromium || true

      - name: Test gate (full suite; heavy science env stays local)
        run: PYTHONPATH=src .venv/bin/python -m pytest tests/ -q

      - name: Enrich every experiment run
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          HAI_API_KEY: ${{ secrets.HAI_API_KEY }}
        run: |
          for d in experiments/*/; do
            if [ -f "$d/meta.json" ]; then
              ./tools/run_enrichment.sh "$d" || echo "[ci] enrichment degraded for $d (non-fatal)"
            fi
          done

      - name: Build smoke test (site must build with enrichment outputs)
        run: .venv/bin/python frontend/build.py --experiments experiments --out /tmp/kytos-dist-ci

      - name: Commit enrichment artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments
          if git diff --cached --quiet; then
            echo "no enrichment changes to commit"
            exit 0
          fi
          # Churn guard: the enrichment tools re-stamp generated_at / pipeline
          # status / fallback-render UTC times onto every run, so git sees a diff
          # even when nothing meaningful changed. Normalize those ISO stamps away
          # and compare the staged blob against HEAD; if every file is identical
          # modulo the stamps, there is nothing to publish — skip the commit/push.
          norm() { sed -E 's/[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?([+-][0-9]{2}:[0-9]{2}|Z)?/<TS>/g'; }
          meaningful=0
          while IFS= read -r f; do
            new=$(git show ":$f" 2>/dev/null | norm || true)
            old=$(git show "HEAD:$f" 2>/dev/null | norm || true)
            if [ "$new" != "$old" ]; then meaningful=1; fi
          done < <(git diff --cached --name-only)
          if [ "$meaningful" -eq 0 ]; then
            echo "staged enrichment changes are timestamp-only; skipping commit"
            git reset --quiet
            exit 0
          fi
          git commit -m "[observatory-bot] enrichment artifacts ($GITHUB_SHA)"
          git push
